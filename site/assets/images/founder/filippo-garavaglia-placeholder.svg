<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="720"
  viewBox="0 0 720 720"
  role="img"
  aria-labelledby="title description">
  <title id="title">Filippo Garavaglia</title>
  <desc id="description">
    Placeholder image for the creator of GlucoDesk.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1">
      <stop
        offset="0"
        stop-color="#143b67"/>
      <stop
        offset="0.52"
        stop-color="#0b2342"/>
      <stop
        offset="1"
        stop-color="#08182f"/>
    </linearGradient>

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="1">
      <stop
        offset="0"
        stop-color="#7ee7ff"/>
      <stop
        offset="1"
        stop-color="#3b8dff"/>
    </linearGradient>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">
      <feGaussianBlur
        stdDeviation="28"/>
    </filter>
  </defs>

  <rect
    width="720"
    height="720"
    rx="96"
    fill="url(#background)"/>

  <circle
    cx="160"
    cy="146"
    r="152"
    fill="#2ecbff"
    opacity="0.14"
    filter="url(#glow)"/>

  <circle
    cx="582"
    cy="590"
    r="180"
    fill="#5668ff"
    opacity="0.16"
    filter="url(#glow)"/>

  <circle
    cx="360"
    cy="312"
    r="132"
    fill="url(#accent)"
    opacity="0.2"/>

  <path
    d="M212 582C231 461 286 408 360 408C434 408 489 461 508 582"
    fill="none"
    stroke="url(#accent)"
    stroke-width="70"
    stroke-linecap="round"
    opacity="0.82"/>

  <circle
    cx="360"
    cy="290"
    r="112"
    fill="url(#accent)"
    opacity="0.9"/>

  <text
    x="360"
    y="654"
    fill="#eefaff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="700"
    text-anchor="middle">
    FG
  </text>
</svg>
